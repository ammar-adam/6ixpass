# Netlify reads this file. You shouldn't need to change it.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The share image has no file extension, so tell browsers it's a PNG.
[[headers]]
  for = "/opengraph-image"
  [headers.values]
    Content-Type = "image/png"

# Pages from the earlier site that no longer exist. Old links land on the
# home page instead of a dead end. /explore comes back once partners sign.
[[redirects]]
  from = "/explore/*"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/explore"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/app/*"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/app"
  to = "/"
  status = 302
  force = true
[[redirects]]
  from = "/for-business"
  to = "/#owners"
  status = 302
[[redirects]]
  from = "/contact"
  to = "/#faq"
  status = 302
[[redirects]]
  from = "/about"
  to = "/"
  status = 302

[[headers]]
  for = "/apple-icon"
  [headers.values]
    Content-Type = "image/png"

[[headers]]
  for = "/demo/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
