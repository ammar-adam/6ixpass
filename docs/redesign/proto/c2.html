<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>C2: Premium editorial, refined</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="proto.css">
<style>
/*
 * C2: C (like Marriott Bonvoy) with a polish pass. Open with ?theme=light or ?theme=dark.
 * System font (San Francisco on Apple) for everything; Cormorant only for big place names and the logo.
 * 8pt spacing, 20px margins, 12px corners, hairline dividers, one shadow, one accent for small labels.
 */
:root, [data-theme="light"] {
  --bg:#FAF8F5; --card:#FFFFFF; --raised:#FFFFFF; --text:#16140F; --sec:#7A746B; --ter:#A9A298;
  --line:rgba(22,20,15,.12); --accent:#A8643A; --btn:#16140F; --onBtn:#FFFFFF; --fill:rgba(22,20,15,.06);
  --bar:rgba(250,248,245,.82); --scrim:rgba(14,13,11,.42); --ok:#2E7D57; --shadow:0 1px 2px rgba(22,20,15,.06),0 8px 24px -12px rgba(22,20,15,.18);
  --pass:#1B1A17; --onPass:#F4F1EC; --passSec:rgba(244,241,236,.6); --red:#E0382A; --focus:#16140F;
}
[data-theme="dark"] {
  --bg:#0E0D0B; --card:#1A1916; --raised:#22211D; --text:#F4F1EC; --sec:rgba(244,241,236,.6); --ter:rgba(244,241,236,.38);
  --line:rgba(255,255,255,.1); --accent:#D49A6A; --btn:#F4F1EC; --onBtn:#16140F; --fill:rgba(255,255,255,.07);
  --bar:rgba(14,13,11,.78); --scrim:rgba(0,0,0,.6); --ok:#4CC38A; --shadow:0 1px 0 rgba(255,255,255,.04) inset,0 10px 30px -14px rgba(0,0,0,.8);
  --pass:#F4F1EC; --onPass:#16140F; --passSec:rgba(22,20,15,.58); --red:#FF5A4A; --focus:#F4F1EC;
}
#app { font: 17px/1.35 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", sans-serif; letter-spacing: -0.012em; font-variant-numeric: lining-nums; }
.display { font-family: "Cormorant Garamond", Georgia, serif; font-weight: 600; letter-spacing: -0.015em; line-height: 1; font-variant-numeric: lining-nums; }
.m { padding-left: 20px; padding-right: 20px; }
.t-large { font-size: 34px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
.t-title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.t-head { font-size: 17px; font-weight: 600; }
.t-sub { font-size: 15px; color: var(--sec); }
.t-foot { font-size: 13px; color: var(--sec); }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--sec); }
.accent { color: var(--accent); }
.card { background: var(--card); border-radius: 12px; overflow: hidden; box-shadow: var(--shadow); }
.group { background: var(--card); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; padding: 12px 16px; position: relative; width: 100%; }
.row + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; height: .5px; background: var(--line); }
.row .v { color: var(--sec); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.btn { display: flex; width: 100%; align-items: center; justify-content: center; height: 52px; border-radius: 999px; background: var(--btn); color: var(--onBtn); font-size: 17px; font-weight: 600; }
.btn.secondary { background: var(--fill); color: var(--text); }
.btn[disabled] { opacity: .35; }
.navbar { position: sticky; top: 0; z-index: 4; display: flex; align-items: center; justify-content: space-between; height: 44px; padding: 0 12px; background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); }
.iconbtn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 22px; color: var(--text); }
.glass { background: rgba(20,18,15,.35); color: #fff; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); width: 36px; height: 36px; border-radius: 18px; display: grid; place-items: center; }
.tabbar { background: var(--bar); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); }
.tab { color: var(--ter); font-weight: 500; } .tab.on { color: var(--text); }
.tab svg { stroke-width: 1.6; }
.homebar { background: var(--text); }
.status { color: var(--text); }
.seal { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
.seal::before { content: ""; width: 6px; height: 6px; border-radius: 3px; background: currentColor; }
.days { display: flex; gap: 6px; }
.days span { width: 34px; height: 34px; border-radius: 17px; display: grid; place-items: center; font-size: 13px; font-weight: 600; color: var(--ter); background: var(--fill); }
.days span.on { color: var(--text); background: transparent; box-shadow: inset 0 0 0 1px var(--line); }
.days span.today { background: var(--btn); color: var(--onBtn); box-shadow: none; }
.dots { display: inline-flex; gap: 5px; vertical-align: middle; }
.dots i { width: 7px; height: 7px; border-radius: 4px; background: var(--text); }
.dots i.used { background: var(--line); }
.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--fill); position: relative; flex: none; transition: background .2s; box-shadow: inset 0 0 0 1px var(--line); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 6px rgba(0,0,0,.25); transition: left .2s; }
.switch[aria-checked="true"] { background: var(--accent); box-shadow: none; } .switch[aria-checked="true"]::after { left: 22px; }
.mini { flex: none; width: 152px; text-align: left; }
.mini img { width: 152px; height: 190px; border-radius: 12px; object-fit: cover; }
.sheet-wrap { position: absolute; inset: 0; z-index: 10; }
.sheet-wrap .dim { position: absolute; inset: 0; background: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; top: 58px; background: var(--bg); border-radius: 14px 14px 0 0; overflow-y: auto; padding-bottom: 34px; }
.grabber { width: 36px; height: 5px; border-radius: 3px; background: var(--ter); margin: 6px auto 0; opacity: .6; }
.pass { position: relative; background: var(--pass); color: var(--onPass); border-radius: 16px; overflow: hidden; }
.pass .notch { position: absolute; top: 168px; width: 20px; height: 20px; border-radius: 10px; background: var(--bg); }
.timerbar { height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
.timerbar i { display: block; height: 100%; background: var(--onPass); }
@media (prefers-reduced-motion: no-preference) {
  .push { animation: push .32s cubic-bezier(.2,.8,.2,1) both; } @keyframes push { from { opacity: .4; transform: translateX(24px); } }
  .up { animation: up .38s cubic-bezier(.16,1,.3,1) both; } @keyframes up { from { transform: translateY(100%); } }
  .fade { animation: fade .3s ease-out both; } @keyframes fade { from { opacity: 0; } }
}
</style></head>
<body><div id="app"></div>
<script>document.documentElement.dataset.theme = new URLSearchParams(location.search).get("theme") === "dark" ? "dark" : "light";</script>
<script src="proto.js"></script>
<script>
const today = 1; // the demo's Tuesday
const dayStrip = (d) => `<div class="days" aria-label="Runs ${d.map((v, i) => (v ? DAYS[i] : "")).filter(Boolean).join(", ")}">${"MTWTFSS".split("").map((l, i) => `<span class="${d[i] ? (i === today ? "today" : "on") : ""}">${l}</span>`).join("")}</div>`;
const dots = (left, total) => `<span class="dots">${Array.from({ length: total }, (_, i) => `<i class="${i < total - left ? "used" : ""}"></i>`).join("")}</span>`;

const placeBody = ({ S, D, daysText }) => `
  <div style="position:relative;height:360px"><img src="${IMG(D.mine.id)}" alt="" style="width:100%;height:100%;object-fit:cover">
    <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.4) 0%,rgba(0,0,0,0) 30%)"></span>
    <div style="position:absolute;left:0;right:0;top:0">${STATUS.replace('class="status"', 'class="status" style="color:#fff"')}
      <div style="display:flex;justify-content:space-between;padding:4px 16px"><button class="glass" data-go="home" aria-label="Back">${I.back}</button><span class="glass">${I.heart}</span></div></div></div>
  <div class="m" style="padding-top:20px">
    <span class="seal accent" style="background:var(--fill)">Founding Partner</span>
    <h1 class="display" style="font-size:40px;margin-top:12px">${D.mine.name}</h1>
    <p class="t-sub" style="margin-top:8px">${D.mine.kind} · ${D.mine.hood} · <span style="color:var(--ok)">Runs today</span></p>
  </div>
  <div class="m" style="margin-top:24px"><div class="card" style="padding:20px">
    <div class="eyebrow accent">Two for one</div>
    <div style="font-size:24px;font-weight:600;letter-spacing:-0.02em;margin-top:6px">${D.mine.offer}.</div>
    <p class="t-sub" style="margin-top:4px">${D.mine.detail}</p>
    <div style="height:.5px;background:var(--line);margin:16px 0"></div>
    ${dayStrip(D.mine.days)}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:16px"><span class="t-sub">${daysText(D.mine.days)}</span><span class="t-sub" style="display:flex;gap:8px;align-items:center">${dots(D.mine.uses - S.used, D.mine.uses)}${D.mine.uses - S.used} of ${D.mine.uses} left</span></div>
  </div></div>
  <div class="m" style="margin-top:16px"><div class="group">
    <div class="row"><span>Where</span><span class="v">In person only</span></div>
    <div class="row"><span>Applies to</span><span class="v">Food and non-alcoholic</span></div></div></div>
  <div style="height:120px"></div>`;

const redeemBar = ({ S }) => `<div style="position:absolute;left:0;right:0;bottom:0;padding:12px 20px 34px;background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--line);z-index:5">
  ${S.paused ? `<p class="t-foot" style="text-align:center;margin-bottom:8px;color:var(--accent);font-weight:600">Paused by the venue</p><button class="btn" disabled>Redeem</button>` : `<button class="btn" data-act="redeem">Redeem at the table</button>`}</div>`;

startProto({
  home: ({ S, D, daysText }) => `<div class="scroll fade" style="padding-top:0">
    ${STATUS}
    <div class="m" style="display:flex;justify-content:space-between;align-items:center;height:44px"><span class="logo" style="font-size:26px">the <em>6</em> pass</span><button class="iconbtn" aria-label="Search">${I.search}</button></div>
    <div class="m" style="margin-top:12px"><div class="eyebrow">Tuesday · Ossington</div><div class="t-large" style="margin-top:4px">Tonight</div></div>
    <div class="m" style="margin-top:16px"><button class="card" data-go="place" style="display:block;width:100%;text-align:left">
      <span style="position:relative;display:block;height:300px"><img src="${IMG(D.mine.id)}" alt="" style="width:100%;height:100%;object-fit:cover">
        <span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 45%,rgba(0,0,0,.62) 100%)"></span>
        <span class="seal" style="position:absolute;top:12px;left:12px;background:rgba(255,255,255,.92);color:#16140F">New · Founding Partner</span>
        <span style="position:absolute;left:16px;right:16px;bottom:14px;color:#fff"><span class="display" style="display:block;font-size:34px">${D.mine.name}</span><span style="display:block;font-size:15px;margin-top:6px;opacity:.92">${D.mine.offer} · ${daysText(D.mine.days)}</span></span></span></button></div>
    <div class="m" style="margin-top:32px;display:flex;justify-content:space-between;align-items:baseline"><span class="t-title">Two for one nearby</span><span class="t-sub">See all</span></div>
    <div style="display:flex;gap:12px;overflow-x:auto;padding:12px 20px 0;scrollbar-width:none">
      ${D.others.map((p) => `<div class="mini"><img src="${IMG(p.id)}" alt=""><div class="eyebrow accent" style="margin-top:10px;font-size:11px">${p.tag}</div><div class="t-head" style="margin-top:2px;line-height:1.2">${p.name}</div><div class="t-foot">${p.hood}</div></div>`).join("")}</div>
    <div class="m" style="margin-top:32px"><span class="t-title">This week</span></div>
    <div class="m" style="margin-top:12px"><div class="group">
      ${D.others.slice(0, 3).map((p) => `<div class="row"><span style="display:flex;gap:12px;align-items:center"><img src="${IMG(p.id)}" alt="" style="width:44px;height:44px;border-radius:8px;object-fit:cover"><span><span class="t-head" style="display:block;font-size:16px">${p.name}</span><span class="t-foot">${p.offer}</span></span></span><span class="v">${I.chev}</span></div>`).join("")}</div></div>
  </div>${TABS("home")}`,

  place: (ctx) => `<div class="scroll push" style="padding-top:0">${placeBody(ctx)}</div>${redeemBar(ctx)}`,

  code: (ctx) => {
    const { S, D, split, timer } = ctx;
    const pct = Math.max(0, 100 - ((Date.now() - S.issuedAt) / 6000));
    return `<div class="scroll" style="padding-top:0">${placeBody(ctx)}</div>
    <div class="sheet-wrap"><div class="dim fade"></div><div class="sheet up" role="dialog" aria-label="Your code">
      <div class="grabber"></div>
      <div class="m" style="display:flex;justify-content:space-between;align-items:center;height:52px"><span style="width:44px"></span><span class="t-head">Show this to your server</span><button class="iconbtn" data-go="place" aria-label="Close">${I.close}</button></div>
      <div class="m" style="margin-top:8px"><div class="pass">
        <div style="position:relative;height:150px"><img src="${IMG(D.mine.id)}" alt="" style="width:100%;height:100%;object-fit:cover"><span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 60%)"></span>
          <span class="logo" style="position:absolute;top:14px;left:16px;font-size:20px;color:#fff">the <em style="color:#FF6B5A">6</em> pass</span>
          <span class="seal" style="position:absolute;top:14px;right:14px;background:rgba(255,255,255,.9);color:#16140F">Member</span></div>
        <span class="notch" style="left:-10px"></span><span class="notch" style="right:-10px"></span>
        <div style="padding:16px 20px 22px">
          <div class="display" style="font-size:28px">${D.mine.name}</div>
          <div style="font-size:15px;color:var(--passSec);margin-top:4px">${D.mine.offer}</div>
          <div style="border-top:1px dashed var(--passSec);opacity:.5;margin:16px 0 14px"></div>
          <div style="font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--passSec)">Member code</div>
          <div style="font-size:46px;font-weight:600;letter-spacing:.06em;font-variant-numeric:tabular-nums;margin-top:2px">${split(S.code)}</div>
          <div style="display:flex;justify-content:space-between;font-size:13px;color:var(--passSec);margin:10px 0 6px"><span>Valid for 10 minutes</span><span data-timer>${timer()}</span></div>
          <div class="timerbar" style="background:var(--passSec);opacity:.35"><i style="width:${pct}%"></i></div>
        </div></div></div>
      <div class="m" style="margin-top:20px"><div class="group" style="padding:16px">
        <div class="eyebrow accent">For staff</div>
        <p style="font-size:15px;margin-top:6px;line-height:1.4">Check the code matches, then tap Confirm. No scanner, no app, no login at the host stand.</p>
        <button class="btn" data-act="confirm" style="margin-top:14px">Confirm</button></div></div>
    </div></div>`;
  },

  done: ({ S, D }) => `<div class="scroll fade" style="padding-top:0;display:flex;flex-direction:column;padding-bottom:34px">
    <div style="position:relative;height:280px;flex:none"><img src="${IMG(D.mine.id)}" alt="" style="width:100%;height:100%;object-fit:cover"><span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.3) 0%,rgba(0,0,0,0) 30%,var(--bg) 100%)"></span>
      <div style="position:absolute;left:0;right:0;top:0">${STATUS.replace('class="status"', 'class="status" style="color:#fff"')}</div></div>
    <div class="m" style="flex:1;margin-top:12px">
      <div style="display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;font-size:15px"><span style="width:24px;height:24px;border-radius:12px;background:var(--ok);color:#fff;display:grid;place-items:center">${I.check.replace('width="20" height="20"', 'width="14" height="14"')}</span>Confirmed by staff</div>
      <h1 class="display" style="font-size:46px;margin-top:14px">Redeemed.<br><i>Enjoy dinner.</i></h1>
      <p class="t-sub" style="margin-top:14px;font-size:17px;line-height:1.4">${D.mine.offer} at ${D.mine.name}. The owner sees this visit on their dashboard right away.</p>
      <p class="t-foot" style="margin-top:12px;display:flex;gap:8px;align-items:center">${dots(D.mine.uses - S.used, D.mine.uses)}${D.mine.uses - S.used} of ${D.mine.uses} uses left this year</p></div>
    <div class="m" style="margin-top:24px"><button class="btn" data-go="owner">See the owner view</button><button class="btn secondary" data-go="home" style="margin-top:10px">Done</button></div>
  </div>`,

  owner: ({ S, D, ago, daysText, split }) => `<div class="scroll fade" style="padding-top:0">${STATUS}
    <div class="m" style="height:44px;display:flex;align-items:center;justify-content:flex-end"><span class="t-sub" style="font-weight:600">Edit</span></div>
    <div class="m"><div class="eyebrow">Owner view</div><h1 class="display" style="font-size:40px;margin-top:6px">${D.mine.name}</h1></div>
    <div class="m" style="margin-top:20px"><div class="card">
      <div style="position:relative;height:110px"><img src="${IMG(D.mine.id)}" alt="" style="width:100%;height:100%;object-fit:cover"><span style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(0,0,0,.45))"></span><span class="seal" style="position:absolute;left:14px;bottom:12px;background:rgba(255,255,255,.92);color:#16140F">Founding Partner</span></div>
      <div style="display:grid;grid-template-columns:1fr 1fr">
        <div style="padding:16px 20px"><div class="eyebrow">Tonight</div><div style="font-size:34px;font-weight:700;letter-spacing:-0.03em;margin-top:4px">${S.visits.length}</div><div class="t-foot">${S.visits.length === 1 ? "member visit" : "member visits"}</div></div>
        <div style="padding:16px 20px;border-left:.5px solid var(--line)"><div class="eyebrow">You pay</div><div style="font-size:34px;font-weight:700;letter-spacing:-0.03em;margin-top:4px;color:var(--ok)">$0</div><div class="t-foot">no fees, no commission</div></div></div></div></div>
    <div class="m" style="margin-top:32px"><span class="t-title">Recent visits</span></div>
    <div class="m" style="margin-top:12px"><div class="group">${S.visits.length ? S.visits.map((v, i) => `<div class="row"><span style="display:flex;gap:12px;align-items:center"><span style="width:32px;height:32px;border-radius:16px;background:${i === 0 ? "var(--ok)" : "var(--fill)"};color:${i === 0 ? "#fff" : "var(--sec)"};display:grid;place-items:center">${I.check.replace('width="20" height="20"', 'width="15" height="15"')}</span><span><span class="t-head" style="display:block;font-size:16px">${v.offer}</span><span class="t-foot">Member · code ${split(v.code)}</span></span></span><span style="font-size:15px;font-weight:600;color:${i === 0 ? "var(--ok)" : "var(--sec)"}" data-ago="${v.at}">${ago(v.at)}</span></div>`).join("") : `<div class="row"><span class="t-sub">No visits yet. Redeem in the member view and it lands here.</span></div>`}</div></div>
    <div class="m" style="margin-top:32px"><span class="t-title">How a month could look</span><div class="t-foot" style="margin-top:2px">Sample month · illustrative numbers</div></div>
    <div class="m" style="margin-top:12px"><div class="group" style="display:grid;grid-template-columns:repeat(3,1fr)">
      ${[["38", "tables from members"], ["27", "first-time visitors"], ["11", "came back again"]].map(([n, l], i) => `<div style="padding:16px 14px;${i ? "border-left:.5px solid var(--line)" : ""}"><div style="font-size:26px;font-weight:700;letter-spacing:-0.02em">${n}</div><div class="t-foot" style="margin-top:2px;line-height:1.25">${l}</div></div>`).join("")}</div></div>
    <div class="m" style="margin-top:32px"><span class="t-title">You control the offer</span></div>
    <div class="m" style="margin-top:12px"><div class="group">
      <div class="row"><span>Offer</span><span class="v">${D.mine.offer}${I.chev}</span></div>
      <div class="row"><span>Days</span><span class="v">${daysText(D.mine.days)}${I.chev}</span></div>
      <div class="row"><span>Uses per member</span><span class="v">${D.mine.uses} a year${I.chev}</span></div>
      <div class="row"><span>Blackout dates</span><span class="v">None${I.chev}</span></div>
      <div class="row"><span>Pause the offer</span><button class="switch" role="switch" aria-checked="${S.paused}" aria-label="Pause the offer" data-act="pause"></button></div></div>
      <p class="t-foot" style="padding:8px 16px 0">${S.paused ? "Paused. Members see “Paused by the venue” and can’t redeem." : "Members can redeem on your days. Pause any time with 7 days’ notice."}</p></div>
    <div class="m" style="margin-top:28px"><div class="group" style="padding:16px"><div class="eyebrow accent">What it costs</div><p style="margin-top:6px;font-size:16px;line-height:1.4">Free for founding partners for the first 12 months. No commission. No setup.</p></div></div>
    <div style="height:24px"></div>
  </div>${TABS("owner")}`,
});
</script></body></html>
