name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Check the demo places (no alcohol, photos exist and are credited, offers only on open days)
        run: node --experimental-strip-types --no-warnings scripts/places-check.mjs
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://nefnflqknwubmurjzqll.supabase.co
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_xTQU4mZ_6iQU1VTo_3-Y2A_Kxg_k-z8
          NEXT_PUBLIC_SITE_URL: https://the6pass.ca
          NEXT_PUBLIC_ANALYTICS_ENABLED: "false"
          NEXT_PUBLIC_AUTH_MODE: supabase
      - name: Check the static output
        run: |
          test -f out/index.html
          test -f out/privacy.html
          test -f out/terms.html
          test -f out/sitemap.xml
          test -f out/robots.txt
          test -f out/opengraph-image
          grep -q "Yes, email me about The 6 Pass launch and founding member pricing. I can unsubscribe any time." out/index.html
          test -f out/about.html
          test -f out/llms.txt
          grep -q "application/ld+json" out/index.html
      - name: Check nothing forbidden shipped
        run: |
          # Things the site must never say, and keys that must never ship.
          # Owner cost and terms are not decided, so none of these may ship either.
          for s in '$199' '230+' ' Inc.' 'the6ixpass' 'App Store' 'Google Play' 'service_role' '12 months' 'No commission' 'no commission' 'You pay' "30 days' notice" 'Toronto first' 'Ammar'; do
            if grep -rlF -- "$s" out; then
              echo "Forbidden text found in the built site: $s"
              exit 1
            fi
          done
          # supabase-js mentions the prefix itself; only a whole secret key fails.
          if grep -rlE 'sb_secret_[A-Za-z0-9_-]{20,}' out; then
            echo "A Supabase secret key is in the built site."
            exit 1
          fi
      - name: Check the copy has no em dashes
        run: |
          if grep -rn "—" src/content public/llms.txt; then
            echo "Em dash found in site copy. Use a full stop or a comma."
            exit 1
          fi
